<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100617">

<title>Happy Birthday Shaikh Anisha 🎂</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Poppins',sans-serif;
    background:#09030d;
    color:#fff;
    overflow-x:hidden;
}

button{
    font-family:inherit;
}

.hidden{
    display:none!important;
}

/* ================= LOGIN ================= */

#loginScreen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
        radial-gradient(circle at 20% 10%,#7b1769,transparent 32%),
        radial-gradient(circle at 85% 90%,#30206e,transparent 35%),
        #09030d;
}

.login-card{
    width:100%;
    max-width:430px;
    padding:42px 28px;
    text-align:center;
    border-radius:30px;
    background:rgba(255,255,255,.075);
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(18px);
    box-shadow:0 30px 100px rgba(255,0,170,.18);
    animation:loginAppear 1s ease;
}

.login-gift{
    font-size:70px;
    animation:float 2s ease-in-out infinite;
}

.login-card h1{
    font-family:'Cormorant Garamond',serif;
    font-size:48px;
    margin:10px 0 5px;
}

.login-card h1 span{
    color:#ff86c7;
}

.login-card p{
    color:#bbb;
    font-size:14px;
    margin-bottom:25px;
}

.input{
    width:100%;
    border:1px solid rgba(255,255,255,.12);
    outline:none;
    background:rgba(255,255,255,.08);
    color:#fff;
    padding:15px;
    margin:7px 0;
    border-radius:14px;
    font-size:15px;
}

.input:focus{
    border-color:#ff69b7;
    box-shadow:0 0 15px rgba(255,80,180,.15);
}

.input::placeholder{
    color:#999;
}

.btn{
    border:none;
    color:#fff;
    background:linear-gradient(135deg,#ff4ca5,#934aff);
    padding:14px 25px;
    border-radius:30px;
    cursor:pointer;
    font-weight:600;
    box-shadow:0 10px 30px rgba(255,60,170,.25);
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
}

.login-btn{
    width:100%;
    margin-top:12px;
}

#error{
    color:#ff8eae;
    font-size:13px;
    margin-top:12px;
    min-height:18px;
}

/* ================= MAIN ================= */

#website{
    display:none;
}
